[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
# 壳 P1：http 资产服务形态（serving frontendDist @ localhost，避开 tauri:// origin 跨域）
tauri-plugin-localhost = "2"
# 壳 P1：深链最小集（nai:// scheme，注册见 tauri.conf.json plugins.deep-link）
tauri-plugin-deep-link = "2"
